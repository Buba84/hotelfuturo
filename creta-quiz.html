<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Creta Futura · Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --terra:#7B4F1A; --terra-l:#F5E6D3;
  --cielo:#1A4A7B; --cielo-l:#D3E8F5;
  --digit:#2D7B1A; --digit-l:#E0F5D3;
  --gold:#C8A84B; --dark:#0f0e0c; --dark2:#1a1916; --dark3:#232220;
  --text:#f0ece4; --text2:#9a9590; --text3:#5a5752;
  --green:#4caf50; --red:#e53935; --border:rgba(200,168,75,.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}

.screen{display:none;width:100%;max-width:500px;text-align:center;}
.screen.active{display:flex;flex-direction:column;align-items:center;}

.logo{font-family:'Playfair Display',serif;font-size:30px;color:var(--gold);margin-bottom:4px;}
.logo-sub{font-size:13px;color:var(--text2);margin-bottom:6px;}
.round-badge{font-size:15px;font-weight:700;color:var(--gold);background:rgba(200,168,75,.1);border:1px solid var(--border);border-radius:20px;padding:5px 18px;margin-bottom:20px;}

.login-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;}
.field-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;text-align:left;}
.field-input{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:17px;outline:none;margin-bottom:16px;}
.field-input:focus{border-color:var(--gold);}
.squad-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.sq-btn{background:var(--dark3);border:2px solid var(--border);border-radius:10px;padding:14px 8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;text-align:center;}
.sq-btn:hover{border-color:var(--gold);}
.sq-btn.sel-terra{border-color:var(--terra);background:var(--terra-l);color:var(--terra);}
.sq-btn.sel-cielo{border-color:var(--cielo);background:var(--cielo-l);color:var(--cielo);}
.sq-btn.sel-digit{border-color:var(--digit);background:var(--digit-l);color:var(--digit);}
.btn-start{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:12px;padding:16px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px;}
.btn-start:disabled{opacity:.4;cursor:not-allowed;}

.quiz-header{display:flex;justify-content:space-between;width:100%;margin-bottom:16px;}
.q-counter{font-size:14px;color:var(--text2);}
.q-score{font-size:14px;color:var(--gold);font-weight:600;}
.timer-text{font-size:40px;font-weight:700;color:var(--gold);margin-bottom:6px;font-family:'Playfair Display',serif;}
.timer-text.danger{color:var(--red);}
.timer-bar-w{width:100%;height:6px;background:var(--dark3);border-radius:3px;overflow:hidden;margin-bottom:20px;}
.timer-bar{height:100%;background:var(--gold);border-radius:3px;transition:width .1s linear;}
.timer-bar.danger{background:var(--red);}
.question-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:24px 20px;width:100%;margin-bottom:16px;}
.question-text{font-size:20px;font-weight:500;color:var(--text);line-height:1.5;}
.answers{display:flex;flex-direction:column;gap:10px;width:100%;}
.ans-btn{background:var(--dark2);border:2px solid var(--border);border-radius:12px;padding:16px 20px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:12px;}
.ans-btn:hover{border-color:var(--gold);}
.ans-btn.correct{border-color:var(--green);background:rgba(76,175,80,.15);color:var(--green);}
.ans-btn.wrong{border-color:var(--red);background:rgba(229,57,53,.15);color:var(--red);}
.ans-btn.disabled{pointer-events:none;opacity:.5;}
.ans-letter{width:32px;height:32px;border-radius:50%;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.ans-btn.correct .ans-letter{background:var(--green);color:#fff;}
.ans-btn.wrong .ans-letter{background:var(--red);color:#fff;}
.feedback{font-size:17px;font-weight:600;margin-top:14px;padding:12px;border-radius:10px;}
.feedback.correct{background:rgba(76,175,80,.1);color:var(--green);}
.feedback.wrong{background:rgba(229,57,53,.1);color:var(--red);}
.feedback.timeout{background:rgba(200,168,75,.1);color:var(--gold);}
.pts-earned{font-size:13px;color:var(--text2);margin-top:6px;}

.result-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;margin-bottom:16px;}
.r-score{font-family:'Playfair Display',serif;font-size:72px;font-weight:600;color:var(--gold);line-height:1;}
.r-label{font-size:15px;color:var(--text2);margin-bottom:16px;}
.r-stats{display:flex;justify-content:center;gap:24px;}
.r-stat{text-align:center;}
.r-val{font-size:28px;font-weight:600;line-height:1;}
.r-val.g{color:var(--green);} .r-val.r{color:var(--red);} .r-val.gold{color:var(--gold);}
.r-lbl{font-size:11px;color:var(--text3);margin-top:4px;}

.lb-title{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.lb-scroll{max-height:380px;overflow-y:auto;width:100%;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:5px;background:var(--dark2);border:1px solid var(--border);}
.lb-rank{font-size:18px;font-weight:700;color:var(--text3);width:28px;text-align:center;}
.lb-name{flex:1;font-size:14px;font-weight:500;color:var(--text);}
.lb-sq{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;flex-shrink:0;}
.sq-terra{background:var(--terra-l);color:var(--terra);}
.sq-cielo{background:var(--cielo-l);color:var(--cielo);}
.sq-digit{background:var(--digit-l);color:var(--digit);}
.lb-pts{font-size:18px;font-weight:700;color:var(--gold);min-width:46px;text-align:right;}
.wait-msg{font-size:13px;color:var(--text2);margin-top:14px;line-height:1.7;}
.wait-msg strong{color:var(--text);}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="screen-login">
  <div class="logo">🏛️ Creta Futura</div>
  <div class="logo-sub">Quiz · PCTO 2026</div>
  <div class="round-badge" id="round-badge">Round 1</div>
  <div class="login-card">
    <div class="field-label">Il tuo nome e cognome</div>
    <input class="field-input" id="inp-name" placeholder="Scrivi nome e cognome..." oninput="checkReady()">
    <div class="field-label">La tua squadra</div>
    <div class="squad-grid">
      <button class="sq-btn" data-sq="terra" onclick="selectSquad('terra')">🌍 Terra</button>
      <button class="sq-btn" data-sq="cielo" onclick="selectSquad('cielo')">✈️ Cielo</button>
      <button class="sq-btn" data-sq="digit" onclick="selectSquad('digit')">💻 Digitale</button>
    </div>
    <button class="btn-start" id="btn-go" disabled onclick="startQuiz()">Inizia il Quiz</button>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <span class="q-counter" id="q-counter">1 / 10</span>
    <span class="q-score" id="q-score">0 punti</span>
  </div>
  <div class="timer-text" id="timer-text">Leggi...</div>
  <div class="timer-bar-w"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>
  <div class="question-card"><div class="question-text" id="q-text">—</div></div>
  <div class="answers" id="answers" style="display:none"></div>
  <div class="feedback" id="feedback" style="display:none"></div>
  <div class="pts-earned" id="pts-earned" style="display:none"></div>
</div>

<!-- RISULTATI -->
<div class="screen" id="screen-results">
  <div class="logo" style="font-size:22px;margin-bottom:14px;">Quiz completato! 🎉</div>
  <div class="result-card">
    <div class="r-score" id="r-score">0</div>
    <div class="r-label">punti totali</div>
    <div class="r-stats">
      <div class="r-stat"><div class="r-val g" id="r-correct">0</div><div class="r-lbl">Corrette</div></div>
      <div class="r-stat"><div class="r-val r" id="r-wrong">0</div><div class="r-lbl">Sbagliate</div></div>
      <div class="r-stat"><div class="r-val gold" id="r-time">0s</div><div class="r-lbl">Media</div></div>
    </div>
  </div>
  <div class="lb-title">Classifica Round <span id="lb-round">1</span></div>
  <div class="lb-scroll" id="leaderboard"></div>
  <div class="wait-msg">
    <strong>Punteggio:</strong> 10 punti base + bonus velocità (max 8)<br>
    <strong>Squadra:</strong> +1 punto se completi · +2 se 7+ corrette
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, setDoc, collection, onSnapshot, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyCzDnRq7_Tfq7uktNfy2r8tFu0qTdrE-88",
  projectId:"hotelfuturo",
  appId:"1:349688895596:web:81b1e5f3c993099c9b6049"
});
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const ROUND = urlParams.get('round') || '1';
const SCORES_COL = 'creta_quiz_round_' + ROUND;
document.getElementById('round-badge').textContent = 'Round ' + ROUND;
document.getElementById('lb-round').textContent = ROUND;

const ALL_QUESTIONS = {
  '1': [
    {q:"Creta è l'isola più grande della Grecia. Dove si trova esattamente?",a:["Mar Ionio, vicino all'Albania","Mar Mediterraneo, a sud della Grecia continentale","Mar Egeo, vicino alla Turchia","Mar Adriatico, vicino all'Italia"],c:1},
    {q:"Qual è la capitale di Creta?",a:["Chania","Rethymno","Heraklion","Agios Nikolaos"],c:2},
    {q:"Creta è famosa per la civiltà minoica. Quando è vissuta questa civiltà?",a:["500-300 a.C.","2700-1450 a.C.","1000-800 a.C.","100 d.C.-300 d.C."],c:1},
    {q:"Qual è il prodotto agricolo più importante di Creta?",a:["Grano e cereali","Olio d'oliva","Riso","Patate"],c:1},
    {q:"Le Gole di Samaria sono...",a:["Un porto turistico famoso","La gola più lunga d'Europa, parco nazionale di Creta","Un sito archeologico minoico","Un museo a cielo aperto"],c:1},
    {q:"Il formaggio cretese più famoso si chiama...",a:["Feta","Halloumi","Graviera","Pecorino"],c:2},
    {q:"Quanti aeroporti internazionali ha Creta?",a:["1 — solo Heraklion","2 — Heraklion e Chania","3 — Heraklion, Chania e Sitia","4"],c:1},
    {q:"Il palazzo minoico più importante di Creta si trova a...",a:["Chania","Rethymno","Cnosso (vicino Heraklion)","Sitia"],c:2},
    {q:"Il clima di Creta è...",a:["Continentale con inverni freddi","Mediterraneo — estati calde e secche, inverni miti","Tropicale con piogge abbondanti","Artico con neve tutto l'anno"],c:1},
    {q:"Il mese di punta del turismo a Creta è...",a:["Marzo","Maggio","Agosto","Novembre"],c:2},
  ],
  '2': [
    {q:"L'olio d'oliva cretese è rinomato perché...",a:["Costa poco","Ha altissima qualità e bassa acidità — tra i migliori al mondo","È il più abbondante in quantità","Viene esportato solo in Italia"],c:1},
    {q:"Il vino cretese più pregiato si produce con il vitigno...",a:["Chardonnay","Cabernet Sauvignon","Vidiano — vitigno autoctono cretese","Sangiovese"],c:2},
    {q:"La DOP (Denominazione di Origine Protetta) greca equivalente si chiama...",a:["AOC","DOC","PDO — Protected Designation of Origin","IGT"],c:2},
    {q:"Il miele del Monte Ida (Psiloritis) è famoso per...",a:["Il basso costo","Le proprietà terapeutiche — considerato tra i migliori al mondo","La grande quantità prodotta","Il colore scuro"],c:1},
    {q:"Cosa significa 'Mizithra'?",a:["Un tipo di olio d'oliva","Un formaggio fresco cretese simile alla ricotta","Un vino bianco locale","Un'erba aromatica di montagna"],c:1},
    {q:"Il settore agroalimentare cretese rappresenta circa il...",a:["5% dell'economia","15% dell'economia","35% dell'economia — uno dei pilastri produttivi","60% dell'economia"],c:2},
    {q:"Quali erbe aromatiche sono tipiche della macchia mediterranea cretese?",a:["Basilico e prezzemolo","Timo, origano, salvia e lavanda selvatici","Rosmarino e peperoncino","Menta e coriandolo"],c:1},
    {q:"L'olivicoltura a Creta risale a...",a:["500 anni fa","Il periodo romano — 2000 anni fa","L'età del Bronzo — oltre 4000 anni fa","Il Medioevo — 1000 anni fa"],c:2},
    {q:"Come si chiama il pane tradizionale cretese?",a:["Pita","Dakos — pane biscottato base della cucina locale","Focaccia","Ciabatta"],c:1},
    {q:"Il settore vitivinicolo di Creta esporta principalmente verso...",a:["Solo la Grecia continentale","Germania, Gran Bretagna e USA","Solo la Cina","Solo i paesi arabi"],c:1},
  ],
  '3': [
    {q:"Heraklion International Airport si chiama ufficialmente...",a:["Aeroporto di Zeus","Aeroporto Nikos Kazantzakis","Aeroporto di Creta","Aeroporto Minoico"],c:1},
    {q:"Quanti passeggeri transita l'aeroporto di Heraklion ogni anno?",a:["500.000","2 milioni","8-10 milioni","50 milioni"],c:2},
    {q:"I droni in agricoltura possono essere usati per...",a:["Solo per foto turistiche","Monitoraggio colture, irrigazione di precisione, distribuzione fitofarmaci","Solo per la sicurezza","Consegna di pacchi nei villaggi"],c:1},
    {q:"Il porto principale di Creta per i traghetti è...",a:["Chania","Sitia","Heraklion","Rethymno"],c:2},
    {q:"Quale compagnia aerea collega principalmente Creta all'Italia?",a:["Solo Alitalia/ITA","Diverse compagnie tra cui Ryanair, Wizz Air, Aegean","Solo Ryan Air","Solo voli charter"],c:1},
    {q:"Il tempo di volo dall'Italia a Creta è circa...",a:["30 minuti","1 ora","2-2,5 ore","5 ore"],c:2},
    {q:"L'agricoltura di precisione con i droni permette di ridurre l'uso di...",a:["Manodopera e pesticidi fino al 30-40%","Solo il tempo di lavoro","Solo i costi di trasporto","Solo l'acqua"],c:0},
    {q:"La rete stradale principale di Creta si chiama...",a:["Autostrada E75","VOAK — Autostrada nord-cretese","Strada Minoica","Via Cretense"],c:1},
    {q:"Quante ore di traghetto ci vogliono dal Pireo (Atene) a Creta?",a:["2-3 ore","6-9 ore","15 ore","24 ore"],c:1},
    {q:"L'aeroporto di Chania serve principalmente...",a:["Il traffico cargo","Il turismo nella parte occidentale di Creta","Solo voli militari","Il traffico interno greco"],c:1},
  ],
  '4': [
    {q:"Il Parco Nazionale delle Gole di Samaria è famoso per...",a:["Le spiagge","La gola più lunga d'Europa — 18 km — con flora e fauna unica","Le cave di marmo","I vigneti di alta quota"],c:1},
    {q:"La capra selvatica cretese si chiama...",a:["Capricorno","Kri-kri — specie endemica protetta di Creta","Stambecco","Camoscio"],c:1},
    {q:"Creta è a rischio per...",a:["Le piogge eccessive","Siccità, incendi estivi e erosione costiera per il turismo di massa","I terremoti vulcanici","Le valanghe invernali"],c:1},
    {q:"La Convenzione di Barcellona riguarda...",a:["Il commercio di vino","La protezione del Mar Mediterraneo dall'inquinamento","Il turismo sostenibile","Le rotte aeree"],c:1},
    {q:"L'impatto del turismo di massa sull'ambiente cretese include...",a:["Solo effetti positivi sull'economia","Consumo eccessivo di acqua, produzione di rifiuti, pressione su aree protette","Solo problemi di traffico","Nessun impatto rilevante"],c:1},
    {q:"La dieta mediterranea cretese è patrimonio UNESCO perché...",a:["È la più economica al mondo","Rappresenta un modello di sostenibilità alimentare e salute riconosciuto globalmente","È la più famosa nei ristoranti","Ha il miglior gusto"],c:1},
    {q:"Cosa sono le Biosphere Reserve UNESCO?",a:["Riserve di carburante biologico","Aree dove uomo e natura coesistono in modo sostenibile, riconosciute dall'UNESCO","Musei naturali all'aperto","Zone vietate all'accesso umano"],c:1},
    {q:"Il cambiamento climatico a Creta sta causando...",a:["Più piogge e temperature più fresche","Stagioni più calde, siccità prolungate e rischio per la produzione agricola","Nessun cambiamento rilevabile","Più neve in inverno"],c:1},
    {q:"L'ecoturismo a Creta punta su...",a:["Grandi resort tutto incluso","Turismo lento, esperienze locali, ridotto impatto ambientale","Solo il turismo balneare","I crocieristi"],c:1},
    {q:"Le energie rinnovabili più usate a Creta sono...",a:["Nucleare e idroelettrico","Solare ed eolico — ideali per il clima mediterraneo","Solo il gas naturale","Il carbone"],c:1},
  ],
};

const roundNum = parseInt(ROUND) || 1;
const setNum = ((roundNum - 1) % 4) + 1;
const QUESTIONS = ALL_QUESTIONS[String(setNum)] || ALL_QUESTIONS['1'];
const TIMER = 8;

let selectedSquad = null;
let currentStudent = null;
let currentQ = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let totalTime = 0;
let timer = null;
let timeLeft = TIMER;
let answered = false;
let answersEnabled = false;

window.selectSquad = function(sq) {
  selectedSquad = sq;
  document.querySelectorAll('.sq-btn').forEach(b => b.className = 'sq-btn');
  document.querySelector('[data-sq="'+sq+'"]').className = 'sq-btn sel-'+sq;
  checkReady();
};

window.checkReady = function() {
  const name = document.getElementById('inp-name').value.trim();
  document.getElementById('btn-go').disabled = !(name.length >= 3 && selectedSquad);
};

window.startQuiz = async function() {
  const name = document.getElementById('inp-name').value.trim();
  const words = name.toLowerCase().replace(/\s+/g,' ').split(' ').sort();
  const nameKey = words.join('_') + '_r' + ROUND;
  try {
    const existing = await getDoc(doc(db, SCORES_COL, nameKey));
    if(existing.exists()) { alert('⚠️ Hai già giocato questo round!'); return; }
    await setDoc(doc(db, SCORES_COL, nameKey), { name, squad:selectedSquad, score:0, correct:0, wrong:0, avgTime:0, round:ROUND, status:'in_progress', timestamp:Date.now() });
  } catch(e) { console.error(e); }
  currentStudent = { name, squad:selectedSquad, key:nameKey };
  currentQ = 0; score = 0; correctCount = 0; wrongCount = 0; totalTime = 0;
  showScreen('screen-quiz');
  loadQuestion();
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadQuestion() {
  answered = false; answersEnabled = false;
  const q = QUESTIONS[currentQ];
  document.getElementById('q-counter').textContent = (currentQ+1) + ' / ' + QUESTIONS.length;
  document.getElementById('q-score').textContent = score + ' punti';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('pts-earned').style.display = 'none';

  const indices = [0,1,2,3];
  for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]];}

  const container = document.getElementById('answers');
  container.innerHTML = '';
  container.style.display = 'none';
  const letters = ['A','B','C','D'];
  indices.forEach((origIdx, newIdx) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.innerHTML = '<span class="ans-letter">'+letters[newIdx]+'</span>'+q.a[origIdx];
    btn.dataset.origIdx = origIdx;
    btn.onclick = () => { if(answersEnabled) selectAnswer(origIdx); };
    container.appendChild(btn);
  });

  document.getElementById('timer-text').textContent = 'Leggi...';
  document.getElementById('timer-bar').style.width = '100%';
  document.getElementById('timer-bar').className = 'timer-bar';

  setTimeout(() => {
    container.style.display = 'flex';
    answersEnabled = true;
    timeLeft = TIMER;
    updateTimer();
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft -= .1;
      updateTimer();
      if(timeLeft <= 0) { clearInterval(timer); timeUp(); }
    }, 100);
  }, 2500);
}

function updateTimer() {
  const t = Math.max(0, timeLeft);
  const pct = (t/TIMER)*100;
  document.getElementById('timer-text').textContent = Math.ceil(t);
  document.getElementById('timer-text').className = 'timer-text' + (t<=2?' danger':'');
  document.getElementById('timer-bar').style.width = pct+'%';
  document.getElementById('timer-bar').className = 'timer-bar' + (t<=2?' danger':'');
}

function selectAnswer(origIdx) {
  if(answered||!answersEnabled) return;
  answered = true; clearInterval(timer);
  const q = QUESTIONS[currentQ];
  const responseTime = TIMER - timeLeft;
  totalTime += responseTime;

  document.querySelectorAll('.ans-btn').forEach(btn => {
    const bIdx = parseInt(btn.dataset.origIdx);
    if(bIdx === q.c) btn.classList.add('correct');
    if(bIdx === origIdx && bIdx !== q.c) btn.classList.add('wrong');
    if(bIdx !== origIdx && bIdx !== q.c) btn.classList.add('disabled');
  });

  const fb = document.getElementById('feedback');
  const pe = document.getElementById('pts-earned');
  fb.style.display = 'block'; pe.style.display = 'block';

  if(origIdx === q.c) {
    const bonus = Math.ceil((timeLeft/TIMER)*8);
    const pts = (10+bonus) * (ROUND==='50'?2:1);
    score += pts; correctCount++;
    fb.className = 'feedback correct';
    fb.textContent = '✅ Corretto!';
    pe.textContent = '+'+pts+' punti';
  } else {
    wrongCount++;
    fb.className = 'feedback wrong';
    fb.textContent = '❌ Sbagliato!';
    pe.textContent = '+0 punti';
  }
  document.getElementById('q-score').textContent = score+' punti';
  setTimeout(() => { currentQ++; currentQ < QUESTIONS.length ? loadQuestion() : endQuiz(); }, 2000);
}

function timeUp() {
  if(answered) return; answered = true; wrongCount++;
  const q = QUESTIONS[currentQ];
  document.querySelectorAll('.ans-btn').forEach(btn => {
    if(parseInt(btn.dataset.origIdx)===q.c) btn.classList.add('correct');
    else btn.classList.add('disabled');
  });
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  document.getElementById('pts-earned').style.display = 'block';
  fb.className = 'feedback timeout';
  fb.textContent = '⏰ Tempo scaduto!';
  document.getElementById('pts-earned').textContent = '+0 punti';
  totalTime += TIMER;
  setTimeout(() => { currentQ++; currentQ < QUESTIONS.length ? loadQuestion() : endQuiz(); }, 2000);
}

async function endQuiz() {
  document.getElementById('r-score').textContent = score;
  document.getElementById('r-correct').textContent = correctCount;
  document.getElementById('r-wrong').textContent = wrongCount;
  document.getElementById('r-time').textContent = (totalTime/QUESTIONS.length).toFixed(1)+'s';
  showScreen('screen-results');
  try {
    await setDoc(doc(db, SCORES_COL, currentStudent.key), {
      name:currentStudent.name, squad:currentStudent.squad, score, correct:correctCount,
      wrong:wrongCount, avgTime:parseFloat((totalTime/QUESTIONS.length).toFixed(1)),
      round:ROUND, status:'completed', timestamp:Date.now()
    });
  } catch(e) { console.error(e); }
  loadLeaderboard();
}

function loadLeaderboard() {
  const SQN = {terra:'Terra',cielo:'Cielo',digit:'Digitale'};
  onSnapshot(collection(db, SCORES_COL), snap => {
    const scores = [];
    snap.forEach(d => { const s=d.data(); if(s.status!=='in_progress') scores.push(s); });
    scores.sort((a,b)=>b.score-a.score);
    const medals = ['🥇','🥈','🥉'];
    document.getElementById('leaderboard').innerHTML = scores.map((s,i)=>
      '<div class="lb-row">'+
        '<span class="lb-rank">'+(i<3?medals[i]:i+1)+'</span>'+
        '<span class="lb-name">'+s.name+'</span>'+
        '<span class="lb-sq sq-'+s.squad+'">'+(SQN[s.squad]||s.squad)+'</span>'+
        '<span class="lb-pts">'+s.score+'</span>'+
      '</div>'
    ).join('');
  });
}
</script>
</body>
