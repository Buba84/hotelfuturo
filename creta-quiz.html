<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Creta Futura · Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--terra:#7B4F1A;--terra-l:#F5E6D3;--cielo:#1A4A7B;--cielo-l:#D3E8F5;--digit:#2D7B1A;--digit-l:#E0F5D3;--gold:#C8A84B;--dark:#0f0e0c;--dark2:#1a1916;--dark3:#232220;--text:#f0ece4;--text2:#9a9590;--text3:#5a5752;--green:#4caf50;--red:#e53935;--border:rgba(200,168,75,.15);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.screen{display:none;width:100%;max-width:500px;text-align:center;}.screen.active{display:flex;flex-direction:column;align-items:center;}
.logo{font-family:'Playfair Display',serif;font-size:30px;color:var(--gold);margin-bottom:4px;}.logo-sub{font-size:13px;color:var(--text2);margin-bottom:6px;}
.round-badge{font-size:15px;font-weight:700;color:var(--gold);background:rgba(200,168,75,.1);border:1px solid var(--border);border-radius:20px;padding:5px 18px;margin-bottom:20px;}
.login-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;}
.field-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;text-align:left;}
.field-input{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:17px;outline:none;margin-bottom:16px;}.field-input:focus{border-color:var(--gold);}
.squad-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.sq-btn{background:var(--dark3);border:2px solid var(--border);border-radius:10px;padding:14px 8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;text-align:center;}.sq-btn:hover{border-color:var(--gold);}
.sq-btn.sel-terra{border-color:var(--terra);background:var(--terra-l);color:var(--terra);}.sq-btn.sel-cielo{border-color:var(--cielo);background:var(--cielo-l);color:var(--cielo);}.sq-btn.sel-digit{border-color:var(--digit);background:var(--digit-l);color:var(--digit);}
.btn-start{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:12px;padding:16px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px;}.btn-start:disabled{opacity:.4;cursor:not-allowed;}
.quiz-header{display:flex;justify-content:space-between;width:100%;margin-bottom:16px;}.q-counter{font-size:14px;color:var(--text2);}.q-score{font-size:14px;color:var(--gold);font-weight:600;}
.timer-text{font-size:40px;font-weight:700;color:var(--gold);margin-bottom:6px;font-family:'Playfair Display',serif;}.timer-text.danger{color:var(--red);}
.timer-bar-w{width:100%;height:6px;background:var(--dark3);border-radius:3px;overflow:hidden;margin-bottom:20px;}.timer-bar{height:100%;background:var(--gold);border-radius:3px;transition:width .1s linear;}.timer-bar.danger{background:var(--red);}
.question-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:24px 20px;width:100%;margin-bottom:16px;}.question-text{font-size:20px;font-weight:500;color:var(--text);line-height:1.5;}
.answers{display:flex;flex-direction:column;gap:10px;width:100%;}
.ans-btn{background:var(--dark2);border:2px solid var(--border);border-radius:12px;padding:16px 20px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:12px;}.ans-btn:hover{border-color:var(--gold);}
.ans-btn.correct{border-color:var(--green);background:rgba(76,175,80,.15);color:var(--green);}.ans-btn.wrong{border-color:var(--red);background:rgba(229,57,53,.15);color:var(--red);}.ans-btn.disabled{pointer-events:none;opacity:.5;}
.ans-letter{width:32px;height:32px;border-radius:50%;background:var(--dark3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}.ans-btn.correct .ans-letter{background:var(--green);color:#fff;}.ans-btn.wrong .ans-letter{background:var(--red);color:#fff;}
.feedback{font-size:17px;font-weight:600;margin-top:14px;padding:12px;border-radius:10px;}.feedback.correct{background:rgba(76,175,80,.1);color:var(--green);}.feedback.wrong{background:rgba(229,57,53,.1);color:var(--red);}.feedback.timeout{background:rgba(200,168,75,.1);color:var(--gold);}
.pts-earned{font-size:13px;color:var(--text2);margin-top:6px;}
.result-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;margin-bottom:16px;}
.r-score{font-family:'Playfair Display',serif;font-size:72px;font-weight:600;color:var(--gold);line-height:1;}.r-label{font-size:15px;color:var(--text2);margin-bottom:16px;}
.r-stats{display:flex;justify-content:center;gap:24px;}.r-stat{text-align:center;}.r-val{font-size:28px;font-weight:600;line-height:1;}.r-val.g{color:var(--green);}.r-val.r{color:var(--red);}.r-val.gold{color:var(--gold);}.r-lbl{font-size:11px;color:var(--text3);margin-top:4px;}
.lb-title{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}.lb-scroll{max-height:380px;overflow-y:auto;width:100%;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:5px;background:var(--dark2);border:1px solid var(--border);}
.lb-rank{font-size:18px;font-weight:700;color:var(--text3);width:28px;text-align:center;}.lb-name{flex:1;font-size:14px;font-weight:500;color:var(--text);}
.lb-sq{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;flex-shrink:0;}.sq-terra{background:var(--terra-l);color:var(--terra);}.sq-cielo{background:var(--cielo-l);color:var(--cielo);}.sq-digit{background:var(--digit-l);color:var(--digit);}
.lb-pts{font-size:18px;font-weight:700;color:var(--gold);min-width:46px;text-align:right;}
.setup-msg{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);border-radius:12px;padding:20px;margin:20px;color:var(--green);font-size:16px;max-width:500px;text-align:center;}
</style>
</head>
<body>
<div class="screen active" id="screen-login">
  <div class="logo">🏛️ Creta Futura</div><div class="logo-sub">Quiz · PCTO 2026</div>
  <div class="round-badge" id="round-badge">Round 1</div>

</div>
<div class="screen" id="screen-quiz">

  <div class="timer-text" id="timer-text">Leggi...</div>
  <div class="timer-bar-w"><div class="timer-bar" id="timer-bar" style="width:100%"></div></div>
  <div class="question-card"><div class="question-text" id="q-text">—</div></div>
  <div class="answers" id="answers" style="display:none"></div>
  <div class="feedback" id="feedback" style="display:none"></div>
  <div class="pts-earned" id="pts-earned" style="display:none"></div>
</div>
<div class="screen" id="screen-results">
  <div class="logo" style="font-size:22px;margin-bottom:14px;">Quiz completato! 🎉</div>
  <div class="result-card"><div class="r-score" id="r-score">0</div><div class="r-label">punti totali</div>
    <div class="r-stats"><div class="r-stat"><div class="r-val g" id="r-correct">0</div><div class="r-lbl">Corrette</div></div><div class="r-stat"><div class="r-val r" id="r-wrong">0</div><div class="r-lbl">Sbagliate</div></div><div class="r-stat"><div class="r-val gold" id="r-time">0s</div><div class="r-lbl">Media</div></div></div>
  </div>
  <div class="lb-title">Classifica Round <span id="lb-round">1</span></div>
  <div class="lb-scroll" id="leaderboard"></div>
</div>
<div id="setup-screen" style="display:none;"></div>

// DOMANDE SENZA RISPOSTE CORRETTE — le chiavi sono su Firebase
const Q_TERRA={'1':[{q:"Qual è il prodotto agricolo principale di Creta?",a:["grano coltivato nelle pianure","olio di oliva extravergine","riso delle zone costiere","patate delle aree montane"]},{q:"Il formaggio Graviera cretese è...",a:["un formaggio fresco spalmabile","simile al parmigiano italiano","un formaggio stagionato di pecora","prodotto solo in estate"]},{q:"La Mizithra è un formaggio...",a:["fresco simile alla ricotta","stagionato come il pecorino","affumicato di capra selvatica","importato dalla Grecia continentale"]},{q:"Il miele cretese è famoso per...",a:["il suo colore molto scuro","i fiori di timo selvatico","il prezzo molto basso","la produzione industriale massiva"]},{q:"L'olivicoltura a Creta risale a...",a:["cinquecento anni fa circa","il periodo medievale europeo","oltre quattromila anni fa","il diciannovesimo secolo moderno"]},{q:"Quanti ulivi ci sono a Creta?",a:["circa trentacinque milioni alberi","meno di un milione","esattamente dieci milioni piante","circa centomila alberi totali"]},{q:"Il Dakos è un piatto cretese con...",a:["riso e pesce fresco","pane biscottato e pomodoro","pasta e salsa di carne","polenta e formaggio fuso"]},{q:"Le erbe aromatiche cretesi crescono...",a:["solo nelle serre moderne","nella macchia mediterranea selvatica","solo nei giardini privati","nelle zone industriali urbane"]},{q:"Il vitigno Vidiano produce vini...",a:["rossi molto corposi tannici","bianchi aromatici di qualità","rosati leggeri da tavola","spumanti dolci da dessert"]},{q:"L'olio DOP cretese ha...",a:["alta acidità e sapore forte","bassa acidità e alta qualità","nessuna certificazione riconosciuta","solo mercato locale ristretto"]}],'2':[{q:"Il vitigno Kotsifali produce vini...",a:["bianchi secchi molto freschi","rossi morbidi e fruttati","spumanti metodo classico tradizionale","liquorosi dolci da meditazione"]},{q:"La dieta cretese è patrimonio UNESCO perché...",a:["costa molto poco farla","è un modello di salute","usa solo carne di agnello","elimi try{const ex=await getDoc(doc(db,SCORES_COL,nameKey));if(ex.exists()){alert('⚠️ Hai già giocato questo round!');return;}await setDoc(doc(db,SCORES_COL,nameKey),{name,squad:selectedSquad,score:0,correct:0,wrong:0,avgTime:0,round:ROUND,status:'in_progress',timestamp:Date.now()});}catch(e){console.error(e);}
const{questions,keyName}=getQData(selectedSquad,ROUND);QUESTIONS=questions;
try{const kd=await getDoc(doc(db,'creta_quiz_keys',keyName));if(kd.exists()){KEYS=kd.data().answers;}else{alert('⚠️ Chiavi non trovate. Contatta il professore.');return;}}catch(e){alert('⚠️ Errore connessione.');return;}
currentStudent={name,squad:selectedSquad,key:nameKey};currentQ=0;score=0;correctCount=0;wrongCount=0;totalTime=0;showScreen('screen-quiz');loadQuestion();};
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function loadQuestion(){answered=false;answersEnabled=false;const q=QUESTIONS[currentQ];document.getElementById('q-counter').textContent=(currentQ+1)+'/'+QUESTIONS.length;document.getElementById('q-score').textContent=score+' punti';document.getElementById('q-text').textContent=q.q;document.getElementById('feedback').style.display='none';document.getElementById('pts-earned').style.display='none';
const idx=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
const c=document.getElementById('answers');c.innerHTML='';c.style.display='none';const L=['A','B','C','D'];
idx.forEach((oi,ni)=>{const b=document.createElement('button');b.className='ans-btn';b.innerHTML='<span class="ans-letter">'+L[ni]+'</span>'+q.a[oi];b.dataset.origIdx=oi;b.onclick=()=>{if(answersEnabled)selectAnswer(oi);};c.appendChild(b);});
document.getElementById('timer-text').textContent='Leggi...';document.getElementById('timer-bar').style.width='100%';document.getElementById('timer-bar').className='timer-bar';
setTimeout(()=>{c.style.display='flex';answersEnabled=true;timeLeft=TIMER;updateTimer();clearInterval(timer);timer=setInterval(()=>{timeLeft-=.1;updateTimer();if(timeLeft<=0){clearInterval(timer);timeUp();}},100);},2500);}
function updateTimer(){const t=Math.max(0,timeLeft);document.getElementById('timer-text').textContent=Math.ceil(t);document.getElementById('timer-text').className='timer-text'+(t<=3?' danger':'');document.getElementById('timer-bar').style.width=(t/TIMER*100)+'%';document.getElementById('timer-bar').className='timer-bar'+(t<=3?' danger':'');}
function selectAnswer(oi){if(answered||!answersEnabled)return;answered=true;clearInterval(timer);const ci=KEYS[currentQ];totalTime+=TIMER-timeLeft;
document.querySelectorAll('.ans-btn').forEach(b=>{const bi=parseInt(b.dataset.origIdx);if(bi===ci)b.classList.add('correct');if(bi===oi&&bi!==ci)b.classList.add('wrong');if(bi!==oi&&bi!==ci)b.classList.add('disabled');});
const fb=document.getElementById('feedback'),pe=document.getElementById('pts-earned');fb.style.display='block';pe.style.display='block';
if(oi===ci){const bonus=Math.ceil((timeLeft/TIMER)*10);const pts=10+bonus;score+=pts;correctCount++;fb.className='feedback correct';fb.textContent='✅ Corretto!';pe.textContent='+'+pts+' punti';}else{wrongCount++;fb.className='feedback wrong';fb.textContent='❌ Sbagliato!';pe.textContent='+0 punti';}
document.getElementById('q-score').textContent=score+' punti';setTimeout(()=>{currentQ++;currentQ<QUESTIONS.length?loadQuestion():endQuiz();},2000);}
function timeUp(){if(answered)return;answered=true;wrongCount++;const ci=KEYS[currentQ];document.querySelectorAll('.ans-btn').forEach(b=>{if(parseInt(b.dataset.origIdx)===ci)b.classList.add('correct');else b.classList.add('disabled');});
document.getElementById('feedback').style.display='block';document.getElementById('pts-earned').style.display='block';document.getElementById('feedback').className='feedback timeout';document.getElementById('feedback').textContent='⏰ Tempo scaduto!';document.getElementById('pts-earned').textContent='+0 punti';totalTime+=TIMER;setTimeout(()=>{currentQ++;currentQ<QUESTIONS.length?loadQuestion():endQuiz();},2000);}
async function endQuiz(){document.getElementById('r-score').textContent=score;document.getElementById('r-correct').textContent=correctCount;document.getElementById('r-wrong').textContent=wrongCount;document.getElementById('r-time').textContent=(totalTime/QUESTIONS.length).toFixed(1)+'s';showScreen('screen-results');
try{await setDoc(doc(db,SCORES_COL,currentStudent.key),{name:currentStudent.name,squad:currentStudent.squad,score,correct:correctCount,wrong:wrongCount,avgTime:parseFloat((totalTime/QUESTIONS.length).toFixed(1)),round:ROUND,status:'completed',timestamp:Date.now()});}catch(e){}loadLeaderboard();}
function loadLeaderboard(){const SQN={terra:'Terra',cielo:'Cielo',digit:'Digitale'};onSnapshot(collection(db,SCORES_COL),snap=>{const sc=[];snap.forEach(d=>{const s=d.data();if(s.status!=='in_progress')sc.push(s);});sc.sort((a,b)=>b.score-a.score);const m=['🥇','🥈','🥉'];document.getElementById('leaderboard').innerHTML=sc.map((s,i)=>'<div class="lb-row"><span class="lb-rank">'+(i<3?m[i]:i+1)+'</span><span class="lb-name">'+s.name+'</span><span class="lb-sq sq-'+s.squad+'">'+(SQN[s.squad]||s.squad)+'</span><span class="lb-pts">'+s.score+'</span></div>').join('');});}
</script>
</body>
</html>
