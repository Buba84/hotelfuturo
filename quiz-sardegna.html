    document.getElementById('vp').content='width=device-width, initial-scale=1.2, maximum-scale=5.0, user-scalable=yes';
  }else{
    document.body.classList.remove('access');
    if(!ACCESS) document.getElementById('vp').content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
  }
};

// Chiavi cifrate — visibili solo a Firebase, non ispezionabili dai ragazzi
const KEYS_ENC={
'1':[1,2,2,1,2],'2':[0,2,0,3,0],'3':[3,2,3,2,2],'4':[1,2,3,2,3],'5':[1,2,1,1,2],'6':[2,0,3,2,2],'7':[0,3,2,2,1],'8':[1,1,0,1,2]
};
const SETUP=urlParams.get('setup')==='true';

if(SETUP){
  document.getElementById('screen-login').innerHTML='<div style="background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);border-radius:12px;padding:20px;color:#4caf50;font-size:16px;max-width:500px;text-align:center;">Caricamento chiavi sessione '+ROUND+' su Firebase...</div>';
  (async()=>{
    try{
      await setDoc(doc(db,'sardegna_quiz_keys','s'+ROUND),{keys:KEYS_ENC[ROUND]||[1,1,1,1,1],ts:Date.now()});
      document.getElementById('screen-login').innerHTML='<div style="background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);border-radius:12px;padding:20px;color:#4caf50;font-size:16px;max-width:500px;text-align:center;">✅ Chiavi sessione '+ROUND+' caricate su Firebase!<br><br>Ora condividi il link SENZA ?setup=true ai ragazzi.</div>';
    }catch(e){
      document.getElementById('screen-login').innerHTML='<div style="background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.3);border-radius:12px;padding:20px;color:#e53935;">❌ Errore: '+e.message+'</div>';
    }
  })();
}

window.startQuiz=async function(){
  playerName=document.getElementById('inp-name').value;
  if(playerName==='Desirè Sabatino') TIMER=15;
  
  // Controlla se ha già giocato questo round
  const playerDocId=playerName.replace(/\s+/g,'_')+'_r'+ROUND;
  try{
    const existing=await getDoc(doc(db,COL,playerDocId));
    if(existing.exists()){
      const d=existing.data();
      score=d.score||0;correctCount=d.correct||0;wrong=d.wrong||0;
      document.getElementById('r-score').textContent=score;
      document.getElementById('r-correct').textContent=correctCount;
      document.getElementById('r-wrong').textContent=wrong;
      document.getElementById('r-time').textContent=(d.avgTime||0)+'s';
      showScreen('screen-results');
      document.querySelector('#screen-results .logo').textContent='⛔ Hai già fatto questo quiz!';
      loadLeaderboard();
      return;
    }
  }catch(e){}
  
  // Carica chiavi
  try{
    const keysDoc=await getDoc(doc(db,'sardegna_quiz_keys','s'+ROUND));
    if(keysDoc.exists()&&keysDoc.data().keys){
      correctKeys=keysDoc.data().keys;
    }else{correctKeys=[1,1,1,1,1];}
  }catch(e){correctKeys=[1,1,1,1,1];}
  
  questions=(QUESTIONS[ROUND]||QUESTIONS['1']).slice();
  
  // Salva subito che ha iniziato (con score 0)
  await setDoc(doc(db,COL,playerDocId),{name:playerName,squad:selectedSquad,score:0,correct:0,wrong:0,avgTime:0,started:true,completed:false,ts:Date.now()});
  
  showScreen('screen-quiz');
  showQuestion();
};

function showQuestion(){
  if(currentQ>=questions.length){endQuiz();return;}
  const q=questions[currentQ];
  document.getElementById('q-counter').textContent=(currentQ+1)+'/'+questions.length;
  document.getElementById('q-score').textContent=score+' pt';
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('feedback').style.display='none';
  document.getElementById('pts-earned').style.display='none';
  const ans=document.getElementById('answers');
  ans.style.display='flex';
  const letters=['A','B','C','D'];
  ans.innerHTML=q.a.map((a,i)=>
    `<button class="ans-btn" data-idx="${i}" onclick="pick(${i})">
      <span class="ans-letter">${letters[i]}</span>${a}
    </button>`
  ).join('');
  startTimer();
}

function startTimer(){
  timeLeft=TIMER;
  clearInterval(timerInterval);
  const txt=document.getElementById('timer-text');
  const bar=document.getElementById('timer-bar');
  txt.className='timer-text';
  bar.className='timer-bar';
  txt.textContent=timeLeft;
  bar.style.width='100%';
  timerInterval=setInterval(()=>{
    timeLeft--;
    txt.textContent=timeLeft;
    bar.style.width=(timeLeft/TIMER*100)+'%';
    if(timeLeft<=3){txt.className='timer-text danger';bar.className='timer-bar danger';}
    if(timeLeft<=0){clearInterval(timerInterval);timeout();}
  },1000);
}

window.pick=function(i){
  clearInterval(timerInterval);
  const elapsed=TIMER-timeLeft;
  times.push(elapsed);
  const correct=correctKeys[currentQ]??1;
  const btns=document.querySelectorAll('.ans-btn');
  btns.forEach((b)=>{
    b.classList.add('disabled');
    const idx=parseInt(b.dataset.idx);
    if(idx===correct) b.classList.add('correct');
    else if(idx===i&&i!==correct) b.classList.add('wrong');
  });
  const isCorrect=i===correct;
  if(isCorrect){
    const pts=Math.max(10,Math.round(100*(1-elapsed/TIMER)));
    score+=pts;correctCount++;
    showFeedback('correct','✓ Corretto! Bravissimo/a!','+ '+pts+' punti');
  }else{
    wrong++;
    showFeedback('wrong','✗ Sbagliato. La risposta corretta è evidenziata.','0 punti');
  }
  // Salva progresso dopo ogni risposta
  const playerDocId=playerName.replace(/\s+/g,'_')+'_r'+ROUND;
  const avgT=times.length?parseFloat((times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)):0;
  setDoc(doc(db,COL,playerDocId),{name:playerName,squad:selectedSquad,score,correct:correctCount,wrong,avgTime:avgT,started:true,completed:false,ts:Date.now()});
  setTimeout(()=>{currentQ++;showQuestion();},2200);
};

function timeout(){
  const correct=correctKeys[currentQ]??1;
  times.push(TIMER);
  wrong++;
  const btns=document.querySelectorAll('.ans-btn');
  btns.forEach(b=>{
    b.classList.add('disabled');
    if(parseInt(b.dataset.idx)===correct) b.classList.add('correct');
  });
  showFeedback('timeout','⏱ Tempo scaduto! La risposta è evidenziata.','0 punti');
  // Salva progresso dopo timeout
  const playerDocId2=playerName.replace(/\s+/g,'_')+'_r'+ROUND;
  const avgT2=times.length?parseFloat((times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)):0;
  setDoc(doc(db,COL,playerDocId2),{name:playerName,squad:selectedSquad,score,correct:correctCount,wrong,avgTime:avgT2,started:true,completed:false,ts:Date.now()});
  setTimeout(()=>{currentQ++;showQuestion();},2200);
}

function showFeedback(cls,text,pts){
  const fb=document.getElementById('feedback');
  fb.className='feedback '+cls;fb.textContent=text;fb.style.display='block';
  const pe=document.getElementById('pts-earned');pe.textContent=pts;pe.style.display='block';
}

async function endQuiz(){
  const avgTime=times.length?parseFloat((times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)):0;
  document.getElementById('r-score').textContent=score;
  document.getElementById('r-correct').textContent=correctCount;
  document.getElementById('r-wrong').textContent=wrong;
  document.getElementById('r-time').textContent=avgTime+'s';
  showScreen('screen-results');
  const playerDocId=playerName.replace(/\s+/g,'_')+'_r'+ROUND;
  await setDoc(doc(db,COL,playerDocId),{name:playerName,squad:selectedSquad,score,correct:correctCount,wrong,avgTime,started:true,completed:true,ts:Date.now()});
  loadLeaderboard();
}

function loadLeaderboard(){
  onSnapshot(collection(db,COL),(snap)=>{
    const rows=[];
    snap.forEach(d=>{const s=d.data();if(s.name) rows.push(s);});
    rows.sort((a,b)=>b.score-a.score||(a.avgTime||99)-(b.avgTime||99));
    const medals=['🥇','🥈','🥉'];
    document.getElementById('leaderboard').innerHTML=rows.map((s,i)=>
      `<div class="lb-row">
        <span class="lb-rank">${i<3?medals[i]:i+1}</span>
        <span class="lb-name">${s.name}</span>
        <span class="lb-sq sq-${s.squad}">${SQ_NAMES[s.squad]||s.squad}</span>
        <span class="lb-pts">${s.score}</span>
      </div>`
    ).join('');
  });
}

let baseFontSize=32;
window.changeSize=function(delta){
  baseFontSize=Math.max(20,Math.min(48,baseFontSize+delta));
  document.querySelectorAll('.question-text').forEach(e=>e.style.fontSize=baseFontSize+'px');
  document.querySelectorAll('.ans-btn').forEach(e=>e.style.fontSize=(baseFontSize-8)+'px');
};

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
