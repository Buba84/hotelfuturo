<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hotel Futuro · Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a84c;--dark:#0f0e0c;--dark2:#1a1916;--dark3:#232220;--dark4:#2a2825;
  --text:#f0ece4;--text2:#9a9590;--text3:#5a5752;
  --amm:#4a90d9;--amm-l:#1a2d42;
  --fin:#d4843a;--fin-l:#3a2510;
  --mkt:#5aaa3a;--mkt-l:#1a2e10;
  --rim:#d45a3a;--rim-l:#3a1a10;
  --green:#4caf50;--red:#e53935;
  --border:rgba(201,168,76,.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;}

.screen{display:none;width:100%;max-width:500px;text-align:center;}
.screen.active{display:flex;flex-direction:column;align-items:center;}

/* LOGIN */
.logo{font-family:'Playfair Display',serif;font-size:32px;color:var(--gold);margin-bottom:4px;}
.logo-sub{font-size:13px;color:var(--text2);margin-bottom:12px;}
.round-badge{font-size:16px;font-weight:700;color:var(--gold);background:rgba(201,168,76,.1);border:1px solid var(--border);border-radius:20px;padding:6px 20px;margin-bottom:20px;letter-spacing:.06em;}
.login-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;}
.field-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;text-align:left;}
.field-select{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;appearance:none;outline:none;margin-bottom:16px;cursor:pointer;}
.field-select option{background:var(--dark2);color:var(--text);}
.btn-start{width:100%;background:var(--gold);color:var(--dark);border:none;border-radius:12px;padding:16px;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:8px;}
.btn-start:hover{opacity:.85;}
.btn-start:disabled{opacity:.4;cursor:not-allowed;}
.squad-selector{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.sq-btn-sel{background:var(--dark3);border:2px solid var(--border);border-radius:10px;padding:14px 10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;text-align:center;}
.sq-btn-sel:hover{border-color:var(--gold);color:var(--text);}
.sq-btn-sel.selected[data-sq="amm"]{border-color:var(--amm);background:var(--amm-l);color:var(--amm);}
.sq-btn-sel.selected[data-sq="fin"]{border-color:var(--fin);background:var(--fin-l);color:var(--fin);}
.sq-btn-sel.selected[data-sq="mkt"]{border-color:var(--mkt);background:var(--mkt-l);color:var(--mkt);}
.sq-btn-sel.selected[data-sq="rim"]{border-color:var(--rim);background:var(--rim-l);color:var(--rim);}
.sq-preview{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:8px;margin-bottom:8px;}
.sq-amm{background:var(--amm-l);color:var(--amm);}
.sq-fin{background:var(--fin-l);color:var(--fin);}
.sq-mkt{background:var(--mkt-l);color:var(--mkt);}
.sq-rim{background:var(--rim-l);color:var(--rim);}

/* QUIZ */
.quiz-header{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:20px;}
.q-counter{font-size:14px;color:var(--text2);}
.q-score{font-size:14px;color:var(--gold);font-weight:600;}
.timer-wrap{width:100%;margin-bottom:20px;}
.timer-bar{height:6px;background:var(--dark3);border-radius:3px;overflow:hidden;}
.timer-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .1s linear;}
.timer-fill.danger{background:var(--red);}
.timer-text{font-size:36px;font-weight:700;color:var(--gold);margin-bottom:6px;font-family:'Playfair Display',serif;}
.timer-text.danger{color:var(--red);}
.question-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:24px 20px;width:100%;margin-bottom:16px;}
.question-text{font-size:20px;font-weight:500;color:var(--text);line-height:1.5;}
.answers{display:flex;flex-direction:column;gap:10px;width:100%;}
.answer-btn{background:var(--dark2);border:2px solid var(--border);border-radius:12px;padding:16px 20px;font-family:'DM Sans',sans-serif;font-size:17px;font-weight:500;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:center;gap:12px;}
.answer-btn:hover{border-color:var(--gold);background:var(--dark3);}
.answer-btn:active{transform:scale(.98);}
.answer-btn.correct{border-color:var(--green);background:rgba(76,175,80,.15);color:var(--green);}
.answer-btn.wrong{border-color:var(--red);background:rgba(229,57,53,.15);color:var(--red);}
.answer-btn.disabled{pointer-events:none;opacity:.5;}
.answer-btn.show-correct{border-color:var(--green);opacity:1;}
.answer-letter{width:32px;height:32px;border-radius:50%;background:var(--dark4);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.answer-btn.correct .answer-letter{background:var(--green);color:#fff;}
.answer-btn.wrong .answer-letter{background:var(--red);color:#fff;}

/* FEEDBACK */
.feedback{font-size:18px;font-weight:600;margin-top:16px;padding:12px;border-radius:10px;}
.feedback.correct{background:rgba(76,175,80,.1);color:var(--green);}
.feedback.wrong{background:rgba(229,57,53,.1);color:var(--red);}
.feedback.timeout{background:rgba(201,168,76,.1);color:var(--gold);}
.points-earned{font-size:14px;color:var(--text2);margin-top:6px;}

/* RESULTS */
.result-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;margin-bottom:16px;}
.result-score{font-family:'Playfair Display',serif;font-size:72px;font-weight:600;color:var(--gold);line-height:1;}
.result-label{font-size:16px;color:var(--text2);margin-bottom:20px;}
.result-detail{display:flex;justify-content:center;gap:24px;margin-top:16px;}
.result-stat{text-align:center;}
.stat-val{font-size:28px;font-weight:600;line-height:1;}
.stat-val.green{color:var(--green);}
.stat-val.red{color:var(--red);}
.stat-val.gold{color:var(--gold);}
.stat-lbl{font-size:12px;color:var(--text3);margin-top:4px;}

/* LEADERBOARD */
.lb-title{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:6px;background:var(--dark2);border:1px solid var(--border);}
.lb-row.me{border-color:var(--gold);background:rgba(201,168,76,.08);}
.lb-rank{font-size:18px;font-weight:700;color:var(--text3);width:28px;text-align:center;}
.lb-row:nth-child(1) .lb-rank{color:var(--gold);}
.lb-row:nth-child(2) .lb-rank{color:#c0c0c0;}
.lb-row:nth-child(3) .lb-rank{color:#cd7f32;}
.lb-name{flex:1;font-size:15px;font-weight:500;color:var(--text);}
.lb-sq{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:10px;flex-shrink:0;}
.lb-pts{font-size:18px;font-weight:700;color:var(--gold);min-width:40px;text-align:right;}
.lb-scroll{max-height:400px;overflow-y:auto;width:100%;}

.btn-retry{background:transparent;border:2px solid var(--gold);color:var(--gold);border-radius:12px;padding:14px 28px;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;}
.btn-retry:hover{background:var(--gold);color:var(--dark);}

.wait-msg{font-size:14px;color:var(--text2);margin-top:16px;line-height:1.6;}
</style>
</head>
<body>

<!-- SCREEN 1: LOGIN -->
<div class="screen active" id="screen-login">
  <div class="logo">Hotel Futuro</div>
  <div class="logo-sub">Quiz · PCTO 2026</div>
  <div class="round-badge" id="round-badge">Round 1</div>
  <div class="login-card">
    <div class="field-label">Il tuo nome e cognome</div>
    <input type="text" class="field-select" id="inp-name" placeholder="Scrivi nome e cognome..." oninput="checkReady()" style="font-size:18px;">
    <div class="field-label">La tua squadra</div>
    <div class="squad-selector" id="squad-sel">
      <button class="sq-btn-sel" data-sq="amm" onclick="selectSquad('amm')">🔵 Amministrazione</button>
      <button class="sq-btn-sel" data-sq="fin" onclick="selectSquad('fin')">🟡 Finanza</button>
      <button class="sq-btn-sel" data-sq="mkt" onclick="selectSquad('mkt')">🟢 Marketing</button>
      <button class="sq-btn-sel" data-sq="rim" onclick="selectSquad('rim')">🔴 RIM</button>
    </div>
    <button class="btn-start" id="btn-go" disabled onclick="startQuiz()">Inizia il Quiz</button>
  </div>
</div>

<!-- SCREEN 2: QUIZ -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <span class="q-counter" id="q-counter">1 / 10</span>
    <span class="q-score" id="q-score">0 punti</span>
  </div>
  <div class="timer-text" id="timer-text">8</div>
  <div class="timer-wrap">
    <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
  </div>
  <div class="question-card">
    <div class="question-text" id="q-text">Domanda</div>
  </div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback" style="display:none"></div>
  <div class="points-earned" id="pts-earned" style="display:none"></div>
</div>

<!-- SCREEN 3: RESULTS -->
<div class="screen" id="screen-results">
  <div class="logo" style="font-size:24px;margin-bottom:16px;">Quiz completato!</div>
  <div class="result-card">
    <div class="result-score" id="r-score">0</div>
    <div class="result-label">punti totali</div>
    <div class="result-detail">
      <div class="result-stat"><div class="stat-val green" id="r-correct">0</div><div class="stat-lbl">Corrette</div></div>
      <div class="result-stat"><div class="stat-val red" id="r-wrong">0</div><div class="stat-lbl">Sbagliate</div></div>
      <div class="result-stat"><div class="stat-val gold" id="r-time">0s</div><div class="stat-lbl">Tempo medio</div></div>
    </div>
  </div>
  <div class="lb-title">Classifica Round <span id="lb-round">1</span></div>
  <div class="lb-scroll" id="leaderboard"></div>
  <div class="wait-msg">I risultati contribuiscono al punteggio della tua squadra!</div>
</div>

const QUESTIONS_MEDIE = [
  {q:"Dove si trova l'Hotel Futuro?",a:["Milano","Gallipoli, in Puglia","Roma","Firenze"],c:1},
  {q:"Cosa significa 'check-in' in un hotel?",a:["Pagare il conto","Registrarsi e ricevere la chiave della stanza","Pulire la camera","Prenotare un taxi"],c:1},
  {q:"Booking.com è un sito per...",a:["Comprare libri","Cercare lavoro","Prenotare hotel e alloggi","Guardare film"],c:2},
  {q:"Un cliente lascia una recensione negativa. Cosa è meglio fare?",a:["Ignorarla","Rispondere con educazione e offrire una soluzione","Cancellare la recensione","Insultare il cliente"],c:1},
  {q:"Cosa vuol dire 'suite' in un hotel?",a:["Una stanza piccola e economica","Una camera grande e di lusso","Il ristorante dell'hotel","La piscina"],c:1},
  {q:"L'alta stagione a Gallipoli è in...",a:["Inverno","Estate (luglio-agosto)","Autunno","Primavera"],c:1},
  {q:"Come si dice 'benvenuto' in inglese?",a:["Goodbye","Thank you","Welcome","Sorry"],c:2},
  {q:"Cosa fa un hotel per far tornare i clienti?",a:["Aumenta i prezzi ogni anno","Offre un servizio eccellente e programmi fedeltà","Chiude in bassa stagione","Toglie la colazione"],c:1},
  {q:"Instagram è utile per un hotel perché...",a:["Si possono fare telefonate gratis","Si possono mostrare foto belle dell'hotel e attirare clienti","Si può ordinare la cena","Si possono pagare le bollette"],c:1},
  {q:"Cosa vuol dire 'vista mare'?",a:["La stanza è sotto il mare","Dalla finestra si vede il mare","L'hotel è una nave","C'è una piscina in camera"],c:1},
];

const TIMER_NORMAL = 8;
const TIMER_SPECIAL = 12;

let isSpecialStudent = false;

const QUESTIONS = ALL_QUESTIONS[ROUND] || ALL_QUESTIONS['1'];

let currentStudent = null;
let selectedSquad = null;
let currentQ = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let totalTime = 0;
let timer = null;
let timeLeft = 8;
let answered = false;

window.selectSquad = function(sq) {
  selectedSquad = sq;
  document.querySelectorAll('.sq-btn-sel').forEach(b => b.classList.remove('selected'));
  document.querySelector('.sq-btn-sel[data-sq="'+sq+'"]').classList.add('selected');
  checkReady();
};

window.checkReady = function() {
  const name = document.getElementById('inp-name').value.trim();
  document.getElementById('btn-go').disabled = !(name.length >= 3 && selectedSquad);
};

window.startQuiz = async function() {
  const name = document.getElementById('inp-name').value.trim();
  const nameKey = name.toLowerCase().replace(/\s+/g,'_');
  
  try {
    const { getDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const existing = await getDoc(doc(db, SCORES_COLLECTION, nameKey));
    if (existing.exists()) {
      alert('⚠️ ' + name + ' ha già completato il quiz! Se pensi sia un errore, chiedi al professore.');
      return;
    }
  } catch(e) {}

  currentStudent = { name: name, squad: selectedSquad, key: nameKey };
  isSpecialStudent = name.toLowerCase().includes('ferrari') && name.toLowerCase().includes('marco');
  if (isSpecialStudent) {
    currentStudent.questions = QUESTIONS_MEDIE;
  } else {
    currentStudent.questions = QUESTIONS;
  }
  currentQ = 0;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  totalTime = 0;
  showScreen('screen-quiz');
  loadQuestion();
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function loadQuestion() {
  answered = false;
  const q = currentStudent.questions[currentQ];
  document.getElementById('q-counter').textContent = (currentQ+1)+' / '+currentStudent.questions.length;
  document.getElementById('q-score').textContent = score+' punti';
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('pts-earned').style.display = 'none';

  const container = document.getElementById('answers');
  container.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.a.forEach((a,i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = '<span class="answer-letter">'+letters[i]+'</span>'+a;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  const TIMER = isSpecialStudent ? TIMER_SPECIAL : TIMER_NORMAL;
  timeLeft = TIMER;
  updateTimerDisplay();
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft -= 0.1;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timer);
      timeUp();
    }
  }, 100);
}

function getTimer() { return isSpecialStudent ? TIMER_SPECIAL : TIMER_NORMAL; }

function updateTimerDisplay() {
  const t = Math.max(0, timeLeft);
  const pct = (t / getTimer()) * 100;
  const el = document.getElementById('timer-text');
  const fill = document.getElementById('timer-fill');
  el.textContent = Math.ceil(t);
  el.className = 'timer-text' + (t <= 3 ? ' danger' : '');
  fill.style.width = pct + '%';
  fill.className = 'timer-fill' + (t <= 3 ? ' danger' : '');
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const q = currentStudent.questions[currentQ];
  const btns = document.querySelectorAll('.answer-btn');
  const responseTime = getTimer() - timeLeft;
  totalTime += responseTime;

  btns.forEach((btn, i) => {
    if (i === q.c) btn.classList.add('correct','show-correct');
    if (i === idx && i !== q.c) btn.classList.add('wrong');
    if (i !== idx && i !== q.c) btn.classList.add('disabled');
  });

  const fb = document.getElementById('feedback');
  const pe = document.getElementById('pts-earned');
  fb.style.display = 'block';
  pe.style.display = 'block';

  if (idx === q.c) {
    const bonus = Math.ceil(timeLeft);
    const pts = 10 + bonus;
    score += pts;
    correctCount++;
    fb.className = 'feedback correct';
    fb.textContent = 'Corretto!';
    pe.textContent = '+'+pts+' punti ('+bonus+' bonus velocità)';
  } else {
    wrongCount++;
    fb.className = 'feedback wrong';
    fb.textContent = 'Sbagliato!';
    pe.textContent = '+0 punti';
  }

  document.getElementById('q-score').textContent = score+' punti';

  setTimeout(() => {
    currentQ++;
    if (currentQ < currentStudent.questions.length) {
      loadQuestion();
    } else {
      endQuiz();
    }
  }, 2000);
}

function timeUp() {
  if (answered) return;
  answered = true;
  wrongCount++;

  const q = currentStudent.questions[currentQ];
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach((btn, i) => {
    if (i === q.c) btn.classList.add('correct','show-correct');
    else btn.classList.add('disabled');
  });

  const fb = document.getElementById('feedback');
  const pe = document.getElementById('pts-earned');
  fb.style.display = 'block';
  pe.style.display = 'block';
  fb.className = 'feedback timeout';
  fb.textContent = 'Tempo scaduto!';
  pe.textContent = '+0 punti';
  totalTime += getTimer();

  setTimeout(() => {
    currentQ++;
    if (currentQ < currentStudent.questions.length) {
      loadQuestion();
    } else {
      endQuiz();
    }
  }, 2000);
}

async function endQuiz() {
  document.getElementById('r-score').textContent = score;
  document.getElementById('r-correct').textContent = correctCount;
  document.getElementById('r-wrong').textContent = wrongCount;
  document.getElementById('r-time').textContent = (totalTime / currentStudent.questions.length).toFixed(1)+'s';

  showScreen('screen-results');

  try {
    // Salva punteggio individuale
    await setDoc(doc(db, SCORES_COLLECTION, currentStudent.key), {
      name: currentStudent.name,
      squad: currentStudent.squad,
      score: score,
      correct: correctCount,
      wrong: wrongCount,
      avgTime: parseFloat((totalTime / currentStudent.questions.length).toFixed(1)),
      round: ROUND,
      timestamp: Date.now()
    });

    // Aggiorna punteggio squadra sul tabellone principale
    const { getDoc: gd, updateDoc } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const statoRef = doc(db, 'corso', 'stato');
    const statoSnap = await gd(statoRef);
    if (statoSnap.exists()) {
      const stato = statoSnap.data();
      const pts = stato.pts || {amm:0,fin:0,mkt:0,rim:0};
      // Ogni quiz completato aggiunge punti alla squadra: 1 punto base + 1 bonus se 7+ corrette
      const teamBonus = correctCount >= 7 ? 2 : 1;
      pts[currentStudent.squad] = (pts[currentStudent.squad] || 0) + teamBonus;
      await updateDoc(statoRef, { pts: pts });
    }
  } catch(e) { console.error(e); }

  loadLeaderboard();
}

function loadLeaderboard() {
  document.getElementById('lb-round').textContent = ROUND;
  const q = query(collection(db, SCORES_COLLECTION));
  onSnapshot(q, (snap) => {
    const scores = [];
    snap.forEach(d => scores.push(d.data()));
    scores.sort((a,b) => b.score - a.score);

    const lb = document.getElementById('leaderboard');
    lb.innerHTML = scores.map((s,i) => {
      const isMe = s.name === currentStudent.name;
      const medals = ['🥇','🥈','🥉'];
      const rank = i < 3 ? medals[i] : (i+1);
      return '<div class="lb-row'+(isMe?' me':'')+'">'+
        '<span class="lb-rank">'+rank+'</span>'+
        '<span class="lb-name">'+s.name+'</span>'+
        '<span class="lb-sq '+SQ_CSS[s.squad]+'">'+SQ_NAMES[s.squad]+'</span>'+
        '<span class="lb-pts">'+s.score+'</span>'+
      '</div>';
    }).join('');
  });
}
</script>
